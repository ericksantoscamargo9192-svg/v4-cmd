name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q DelAnholComandas-etapa3.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Aceitar licencas do Android SDK
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle assembleDebug --no-daemon
        working-directory: DelAnholComandas
      - run: gradle testDebugUnitTest --no-daemon
        working-directory: DelAnholComandas
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: DelAnhol-Comandas-APK
          path: DelAnholComandas/app/build/outputs/apk/debug/app-debug.apk
